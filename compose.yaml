services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediadock}
      POSTGRES_USER: ${POSTGRES_USER:-mediadock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the host environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-mediadock-next-api}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
      args:
        MEDIADOCK_VERSION: ${MEDIADOCK_VERSION:-local}
        MEDIADOCK_COMMIT_SHA: ${MEDIADOCK_COMMIT_SHA:-unknown}
        MEDIADOCK_COMMIT_DATE_UTC: ${MEDIADOCK_COMMIT_DATE_UTC:-unknown}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MediaDock: "Host=db;Port=5432;Database=${POSTGRES_DB:-mediadock};Username=${POSTGRES_USER:-mediadock};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the host environment}"
      Authentication__Google__Enabled: ${GOOGLE_AUTH_ENABLED:-false}
      Authentication__Google__ClientId: ${GOOGLE_AUTH_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      Authentication__Google__CallbackUri: "${GOOGLE_AUTH_CALLBACK_URI:-http://localhost:8080/signin-oidc}"
      ForwardedHeaders__TrustedNetwork: ${FORWARDED_HEADERS_TRUSTED_NETWORK:-}
      DeploymentControl__SocketPath: /run/mediadock-next-deploy-control/control.sock
    volumes:
      - type: bind
        source: ${DEPLOY_CONTROL_SOCKET_DIR:-./.deploy-control}
        target: /run/mediadock-next-deploy-control
        read_only: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:-mediadock-next-api}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
      args:
        MEDIADOCK_VERSION: ${MEDIADOCK_VERSION:-local}
        MEDIADOCK_COMMIT_SHA: ${MEDIADOCK_COMMIT_SHA:-unknown}
        MEDIADOCK_COMMIT_DATE_UTC: ${MEDIADOCK_COMMIT_DATE_UTC:-unknown}
    command: ["--migrate", "true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MediaDock: "Host=db;Port=5432;Database=${POSTGRES_DB:-mediadock};Username=${POSTGRES_USER:-mediadock};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the host environment}"
    profiles:
      - tools
    restart: "no"

  bootstrap-admin:
    image: ${API_IMAGE:-mediadock-next-api}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
      args:
        MEDIADOCK_VERSION: ${MEDIADOCK_VERSION:-local}
        MEDIADOCK_COMMIT_SHA: ${MEDIADOCK_COMMIT_SHA:-unknown}
        MEDIADOCK_COMMIT_DATE_UTC: ${MEDIADOCK_COMMIT_DATE_UTC:-unknown}
    command: ["--bootstrap-admin", "true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MediaDock: "Host=db;Port=5432;Database=${POSTGRES_DB:-mediadock};Username=${POSTGRES_USER:-mediadock};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the host environment}"
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__GivenName: ${BOOTSTRAP_ADMIN_GIVEN_NAME:-}
      BootstrapAdmin__FamilyName: ${BOOTSTRAP_ADMIN_FAMILY_NAME:-}
      BootstrapAdmin__Issuer: ${BOOTSTRAP_ADMIN_ISSUER:-}
      BootstrapAdmin__Subject: ${BOOTSTRAP_ADMIN_SUBJECT:-}
    profiles:
      - tools
    restart: "no"

volumes:
  postgres_data: